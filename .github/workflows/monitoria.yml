name: Banner Monitor

on:
  schedule:
    - cron: "0 8 * * *"   # 08h UTC = 05h Brasília
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Rodar varredura
        run: python scan.py

      - name: Verificar se há alerta
        id: alerta
        run: |
          if grep -q "Tudo ok" resultado.txt; then
            echo "enviar=false" >> "$GITHUB_OUTPUT"
          else
            echo "enviar=true" >> "$GITHUB_OUTPUT"
          fi
          echo "HOJE=$(TZ=America/Sao_Paulo date +%d/%m/%y)" >> "$GITHUB_ENV"

      - name: Enviar e-mail (somente se houver não conformidade)
        if: steps.alerta.outputs.enviar == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Banner Monitor - ${{ env.HOJE }}"
          to: ${{ secrets.MAIL_TO }}
          from: Banner Monitor
          html_body: file://resultado.html
